name: Playback Bug
description: Report a bug related to audio playback (stuttering, skipping, no sound, etc.)
title: "[Playback Bug]: "
labels: ['bug', 'playback']
body:
    - type: markdown
      attributes:
          value: |
              Thanks for taking the time to fill out this playback bug report! If this is a security issue, please report it to TomKo directly.

    - type: textarea
      attributes:
          label: Description
          description: Please describe the playback issue, including what you expect to happen and what is currently happening.
          placeholder: |
              Playback '...' is not working properly. I expect '...' to happen, but '...' happens instead
      validations:
          required: true

    - type: input
      attributes:
          label: Android OS version
          description: Please tell us what's your Android OS Version.
          placeholder: |
            Android 15
      validations:
          required: true

    - type: checkboxes
      id: accountlogin
      attributes:
          label: How are you signed in?
          description: This is critical for diagnosing playback issues.
          options:
              - label: 'Playback login'
              - label: 'Account login'

    - type: textarea
      attributes:
          label: Step-by-step reproduction instructions
          description: Please write the steps needed to reproduce the playback bug.
          placeholder: |
              1. Go to '...'
              2. Click on '...'
              3. Play track '...'
      validations:
          required: true

    - type: dropdown
      attributes:
          label: When does the issue occur?
          description: Select all situations in which the bug happens.
          options:
              - On track start
              - When skipping tracks
              - During queue playback
              - After screen lock / backgrounding
              - With Bluetooth / wired headphones
              - With app in foreground
              - Randomly
              - Other
      validations:
          required: true

    - type: textarea
      attributes:
          label: Screenshots, screen recording, logcat
          description: |
              If possible, please upload a screenshot, screen recording, or logcat output which demonstrates the bug.
              Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
      validations:
          required: false

    - type: checkboxes
      id: existing
      attributes:
          label: Please confirm that you are using Outify with Spotify Premium account
          description: As stated in project's README, Outify requires Spotify Premium to work.
          options:
              - label: 'Yes'
                required: true

    - type: checkboxes
      id: plugins
      attributes:
          label: Please confirm that you have tested clearing storage and cache and trying again.
          description: Sometimes due to app updates data may be in weird state, this will resolve that.
          options:
              - label: 'Yes'
                required: true
