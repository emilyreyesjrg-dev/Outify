name: UI Bug
description: Report a bug related to the user interface, layout, or theming
title: "[UI Bug]: "
labels: ['bug', 'ui']
body:
    - type: markdown
      attributes:
          value: |
              Thanks for taking the time to fill out this UI bug report! If this is a security issue, please report it to TomKo directly.

    - type: textarea
      attributes:
          label: Description
          description: Please describe the UI issue, including what you expect to see and what is currently shown.
          placeholder: |
              The '...' screen looks broken. I expect '...' to be displayed, but instead I see '...'
      validations:
          required: true

    - type: input
      attributes:
          label: Android OS version
          description: Please tell us what's your Android OS Version.
          placeholder: |
            Android 15
      validations:
          required: true

    - type: textarea
      attributes:
          label: Step-by-step reproduction instructions
          description: Please write the steps needed to reproduce the UI bug.
          placeholder: |
              1. Go to '...'
              2. Click on '...'
              3. Scroll down to '...'
      validations:
          required: true

    - type: textarea
      attributes:
          label: Screenshots, screen recording
          description: |
              Please upload a screenshot or screen recording which demonstrates the UI bug. This is especially important for UI bugs.
              Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
      validations:
          required: true
