
name: Build Outify APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Outify
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Install Android NDK
        run: |
          NDK_VERSION="r29"
          NDK_HOME="$HOME/android-ndk-${NDK_VERSION}"

          wget -q https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip
          unzip -q android-ndk-${NDK_VERSION}-linux.zip -d "$HOME"
          rm android-ndk-${NDK_VERSION}-linux.zip

          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK_HOME" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Add Rust Android targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi

      - name: Build librespot ARM64
        working-directory: rust/librespot-ffi
        run: |
          cargo ndk -t arm64-v8a --platform 21 build --release

      - name: Build librespot ARMv7
        working-directory: rust/librespot-ffi
        run: |
          cargo ndk -t armeabi-v7a --platform 21 build --release

      - name: Copy ARM64 library
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp rust/target/aarch64-linux-android/release/liblibrespot_ffi.so \
             app/src/main/jniLibs/arm64-v8a/

      - name: Copy ARMv7 library
        run: |
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          cp rust/target/armv7-linux-androideabi/release/liblibrespot_ffi.so \
             app/src/main/jniLibs/armeabi-v7a/

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Outify-APK
          path: app/build/outputs/apk/debug/*.apk
